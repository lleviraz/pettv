<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- Keeps the secret path out of the Referer header sent to other sites -->
<meta name="referrer" content="no-referrer">
<title>PetTV</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, sans-serif; background: #F0FFF4; color: #1a1a1a;
  }
  .card { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px; text-align: center; max-width: 420px; }
  h1 { margin: 0; font-size: 32px; }
  .hero { width: 210px; height: 280px; border-radius: 28px; object-fit: cover; }
  button {
    font: inherit; font-size: 18px; font-weight: 700; border: 0; border-radius: 14px;
    padding: 16px 36px; color: #fff; background: #27ae60; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.link { background: none; color: #888; font-size: 13px; font-weight: 400; padding: 8px; }
  .muted { color: #888; font-size: 15px; }
  #codeForm { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  #code {
    font: inherit; font-size: 24px; letter-spacing: 4px; text-align: center; text-transform: uppercase;
    padding: 14px; border: 1px solid #ccc; border-radius: 12px; width: 100%;
  }
  .err { color: #c0392b; font-size: 15px; font-weight: 600; }
  [hidden] { display: none !important; }

  #player { position: fixed; inset: 0; background: #000; }
  #player video { position: absolute; top: 50%; left: 50%; object-fit: contain; }
  #rot { top: calc(16px + env(safe-area-inset-top)); left: 16px; }
  #pst { position: absolute; top: 40%; left: 0; right: 0; text-align: center; color: #fff; font-size: 16px; padding: 12px; }
  #player button { position: absolute; font-size: 15px; font-weight: 600; padding: 8px 16px; border-radius: 20px; background: rgba(0,0,0,.6); }
  #disc { top: calc(16px + env(safe-area-inset-top)); right: 16px; }
  #unmute { bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="card" id="home">
  <img class="hero" src="tako.jpg" alt="Tako" width="210" height="280">
  <h1>PetTV</h1>
  <p class="muted" id="msg">Loading…</p>
  <button id="signin" hidden>Sign in with Google</button>
  <button id="request" hidden>Request access</button>
  <form id="codeForm" hidden>
    <input id="code" placeholder="XXXX-XXXX" maxlength="12" autocomplete="one-time-code"
           autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Access code">
    <button type="submit">Unlock</button>
  </form>
  <button id="watch" hidden>▶&nbsp; Watch Live</button>
  <button class="link" id="signout" hidden>Sign out</button>
</div>

<div id="player" hidden>
  <video id="v" autoplay playsinline muted></video>
  <div id="pst">Connecting…</div>
  <button id="disc">✕ Disconnect</button>
  <button id="unmute">🔊 Tap for sound</button>
  <button id="rot">⟳ Rotate</button>
</div>

<script type="module">
const SDK = 'https://www.gstatic.com/firebasejs/13.4.0';
const { initializeApp } = await import(`${SDK}/firebase-app.js`);
const { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } = await import(`${SDK}/firebase-auth.js`);
const { getDatabase, ref, onValue, onChildAdded, set, push, remove, onDisconnect, get, update, serverTimestamp } =
  await import(`${SDK}/firebase-database.js`);

const $ = (id) => document.getElementById(id);
const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];

function show(text, isError = false) {
  $('msg').textContent = text;
  $('msg').className = isError ? 'err' : 'muted';
}

let firebaseConfig;
try {
  ({ firebaseConfig } = await import('../firebase-config.js'));
} catch {
  show('Missing firebase-config.js — copy firebase-config.example.js and fill it in.', true);
  throw new Error('missing config');
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const CODE_ATTEMPT_LIMIT = 5;
const LOCKED_MSG = 'Too many wrong codes. Ask the owner to unlock you.';

let homeOnline = false;
let allowed = false;
let session = null; // { pc, subs, ref }

function refreshButtons() {
  const user = auth.currentUser;
  $('signin').hidden = !!user;
  $('signout').hidden = !user;
  $('watch').hidden = !(user && allowed && homeOnline);
  $('codeForm').hidden = !(user && needsCode);
  // One request per account at a time (the rules refuse a second), so a pending one dims the button
  $('request').hidden = !(user && needsCode);
  $('request').disabled = !!myRequest;
  $('request').textContent = myRequest ? 'Request sent — waiting for the owner' : 'Request access';
}

let myRequest = null;
let reqUnsub = null;

// Live, so the button re-enables as soon as the owner dismisses or answers the request
function watchMyRequest(user) {
  reqUnsub?.();
  reqUnsub = onValue(ref(db, `/requests/${user.uid}`), (snap) => {
    myRequest = snap.val();
    if (needsCode) showNeedsCode(user);
    refreshButtons();
  }, () => { myRequest = null; });
}

function fmtTime(ms) {
  return new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function showNeedsCode(user) {
  show(myRequest?.type === 'viewer'
    ? `Request sent ${fmtTime(myRequest.ts)}. Enter the code the owner sends you.`
    : `${user.email} doesn't have access. Request it, then enter the code the owner sends you.`);
}

// The rules require email to equal the verified Google email, so the owner sees the real address
$('request').onclick = async () => {
  const user = auth.currentUser;
  $('request').disabled = true;
  try {
    await update(ref(db), {
      [`requests/${user.uid}`]: {
        name: (user.displayName || user.email || 'Web viewer').slice(0, 99),
        email: user.email,
        type: 'viewer',
        ts: serverTimestamp(),
      },
      [`log/${push(ref(db, '/log')).key}`]: logEntry('requested', { detail: 'web' }),
    });
  } catch (e) {
    show(`Could not send the request: ${e.message}`, true);
  }
  refreshButtons();
};

function logEntry(event, extra = {}) {
  const user = auth.currentUser;
  return { uid: user.uid, email: user.email ?? 'unknown', event, ts: serverTimestamp(), ...extra };
}

function logEvent(event, extra) {
  return push(ref(db, '/log'), logEntry(event, extra)).catch(() => {});
}

let hbUnsub = null;
let needsCode = false;
let accessUntil = null;
let expiryTimer = null;

function signedInText(user) {
  const until = accessUntil
    ? ` · access until ${new Date(accessUntil).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`
    : '';
  return `Signed in as ${user.email}${until}`;
}

async function loadGrant(user) {
  clearTimeout(expiryTimer);
  accessUntil = null;
  const g = (await get(ref(db, `/grants/${user.uid}`)).catch(() => null))?.val();
  if (g && g.redeemedAt + g.accessMs > Date.now()) {
    accessUntil = g.redeemedAt + g.accessMs;
    // Re-check when the code-based access runs out so the page drops back to the code prompt
    expiryTimer = setTimeout(() => watchAccess(user), Math.min(accessUntil - Date.now() + 1000, 2 ** 31 - 1));
  }
}

async function watchAccess(user) {
  hbUnsub?.();
  hbUnsub = null;
  allowed = false;
  needsCode = false;
  homeOnline = false;
  show(`Signed in as ${user.email}. Checking access…`);
  await loadGrant(user);
  hbUnsub = onValue(ref(db, '/heartbeat'), (snap) => {
    allowed = true;
    homeOnline = snap.exists();
    show(homeOnline ? signedInText(user) : 'Home phone is offline');
    refreshButtons();
  }, async (err) => {
    if (err.code === 'PERMISSION_DENIED') {
      await stopWatching();
      if (!needsCode) logEvent('no-access', { detail: 'web' });
      needsCode = true;
      showNeedsCode(user);
      watchMyRequest(user);
    } else {
      show(`Database error: ${err.message}`, true);
    }
    refreshButtons();
  });
  refreshButtons();
}

onAuthStateChanged(auth, (user) => {
  if (!user) {
    hbUnsub?.();
    hbUnsub = null;
    reqUnsub?.();
    reqUnsub = null;
    myRequest = null;
    clearTimeout(expiryTimer);
    allowed = false;
    needsCode = false;
    homeOnline = false;
    show('Sign in with Google to watch.');
    refreshButtons();
    return;
  }
  watchAccess(user);
});

// Each guess must first be recorded as a counted attempt: the rules only let you read or redeem
// the code you just recorded, and stop recording after CODE_ATTEMPT_LIMIT until the owner resets.
// The grant write and ticket delete go in one atomic update, which is what makes codes single-use.
$('codeForm').onsubmit = async (e) => {
  e.preventDefault();
  const button = $('codeForm').querySelector('button');
  button.disabled = true;
  try {
    await redeem(auth.currentUser, $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, ''));
  } catch (err) {
    show(err.message, true);
  }
  button.disabled = false;
};

async function redeem(user, code) {
  if (code.length !== 8) throw new Error('Enter the 8-character code');
  const prev = (await get(ref(db, `/attempts/${user.uid}`)).catch(() => null))?.val();
  const count = (prev?.count ?? 0) + 1;
  if (count > CODE_ATTEMPT_LIMIT) throw new Error(LOCKED_MSG);
  try {
    await set(ref(db, `/attempts/${user.uid}`), { count, lastCode: code, email: user.email, ts: serverTimestamp() });
  } catch {
    throw new Error(LOCKED_MSG);
  }
  const ticket = (await get(ref(db, `/tickets/${code}`)).catch(() => null))?.val();
  if (!ticket || ticket.expires < Date.now() || ticket.uid !== user.uid) {
    if (count === CODE_ATTEMPT_LIMIT) {
      logEvent('code-locked', { detail: `${CODE_ATTEMPT_LIMIT} wrong codes, web` });
      throw new Error(LOCKED_MSG);
    }
    const left = CODE_ATTEMPT_LIMIT - count;
    const reason = ticket && ticket.uid !== user.uid ? 'This code was issued for a different account' : 'Invalid or expired code';
    throw new Error(`${reason} (${left} ${left === 1 ? 'try' : 'tries'} left)`);
  }
  const days = ticket.accessMs / 86400000;
  const duration = days >= 1 ? `${Math.round(days)}d` : `${Math.round(ticket.accessMs / 3600000)}h`;
  try {
    await update(ref(db), {
      [`log/${push(ref(db, '/log')).key}`]: logEntry('redeemed', {
        detail: `code ${code.slice(0, 4)}-${code.slice(4)}, ${duration}, web`,
      }),
      [`requests/${user.uid}`]: null,
      [`attempts/${user.uid}`]: null,
      [`grants/${user.uid}`]: {
        code,
        redeemedAt: serverTimestamp(),
        accessMs: ticket.accessMs,
        name: (user.displayName || user.email || 'Web viewer').slice(0, 99),
        email: user.email,
      },
      [`tickets/${code}`]: null,
    });
  } catch {
    throw new Error('Code not accepted. Ask the owner for a new one.');
  }
  $('code').value = '';
  await watchAccess(user);
}

$('signin').onclick = async () => {
  $('signin').disabled = true;
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    show(`Sign-in failed: ${e.code ?? e.message}`, true);
  }
  $('signin').disabled = false;
};

$('signout').onclick = async () => {
  await stopWatching();
  await signOut(auth);
};

function pst(text) {
  $('pst').hidden = false;
  $('pst').textContent = text;
}

async function startWatching() {
  const uid = auth.currentUser.uid;
  const sessionRef = ref(db, `/sessions/${uid}`);
  const pc = new RTCPeerConnection({ iceServers: ICE });
  session = { pc, subs: [], ref: sessionRef };
  const s = session;
  const myReq = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

  $('home').hidden = true;
  $('player').hidden = false;
  $('v').muted = true;
  $('unmute').hidden = false;
  pst('Requesting stream…');

  pc.ontrack = (e) => {
    if (e.streams?.[0]) {
      $('v').srcObject = e.streams[0];
      $('v').play().catch(() => {});
    }
  };
  pc.onconnectionstatechange = () => {
    const state = pc.connectionState;
    if (state === 'connected') $('pst').hidden = true;
    else if (state === 'disconnected') pst('Reconnecting…');
    else if (state === 'failed') lost('Connection lost');
  };
  pc.onicecandidate = ({ candidate }) => {
    if (candidate && session === s) push(ref(db, `/sessions/${uid}/ice_viewer`), candidate.toJSON());
  };

  try {
    await remove(sessionRef);
    // Closing the tab or losing the network drops the session so the home phone frees the connection
    await onDisconnect(sessionRef).remove();
    const user = auth.currentUser;
    await set(sessionRef, {
      request: myReq,
      name: user.displayName || user.email || 'Web viewer',
      email: user.email,
      device: deviceName(),
    });
  } catch (e) {
    lost(`Could not request stream: ${e.message}`);
    return;
  }
  pst('Waiting for home phone…');

  // Another device of the same account replaced our request; stop instead of hanging on "Reconnecting"
  s.subs.push(onValue(ref(db, `/sessions/${uid}/request`), (snap) => {
    const req = snap.val();
    if (typeof req === 'string' && req !== myReq && session === s) superseded();
  }));

  let answered = false;
  s.subs.push(onValue(ref(db, `/sessions/${uid}/offer`), async (snap) => {
    const sdp = snap.val();
    if (typeof sdp !== 'string' || answered || session !== s) return;
    answered = true;
    try {
      pst('Creating connection…');
      await pc.setRemoteDescription({ type: 'offer', sdp });
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await set(ref(db, `/sessions/${uid}/answer`), answer.sdp);
      pst('Waiting for stream…');
      s.subs.push(onChildAdded(ref(db, `/sessions/${uid}/ice_home`), (c) => {
        const cand = c.val();
        if (cand?.candidate) pc.addIceCandidate(cand).catch(() => {});
      }));
    } catch (e) {
      lost(`Error: ${e.message}`);
    }
  }));
}

// keepSession: another device now owns the session, so only drop our auto-cleanup, never delete it
async function stopWatching({ keepSession = false } = {}) {
  const s = session;
  if (!s) return;
  session = null;
  s.subs.forEach((unsub) => unsub());
  s.pc.close();
  $('v').srcObject = null;
  $('player').hidden = true;
  $('home').hidden = false;
  await onDisconnect(s.ref).cancel().catch(() => {});
  if (!keepSession) await remove(s.ref).catch(() => {});
}

async function superseded() {
  await stopWatching({ keepSession: true });
  show('Now watching on another device. Tap Watch Live to watch here instead.');
  refreshButtons();
}

function deviceName() {
  const ua = navigator.userAgent;
  const os = /iPhone/.test(ua) ? 'iPhone'
    : /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad'
    : /Android/.test(ua) ? 'Android'
    : /Windows/.test(ua) ? 'Windows'
    : /Mac/.test(ua) ? 'Mac'
    : 'Unknown';
  const browser = /Edg\//.test(ua) ? 'Edge'
    : /CriOS|Chrome\//.test(ua) ? 'Chrome'
    : /FxiOS|Firefox\//.test(ua) ? 'Firefox'
    : /Safari\//.test(ua) ? 'Safari'
    : 'browser';
  return `${os} ${browser} (web)`;
}

async function lost(reason) {
  await stopWatching();
  show(reason, true);
  refreshButtons();
}

$('watch').onclick = () => startWatching();
$('disc').onclick = async () => {
  await stopWatching();
  refreshButtons();
};
let rotation = 0;
try { rotation = Number(localStorage.getItem('pettv-rotation')) || 0; } catch {}

// Sideways turns swap the box so the rotated video still fills the screen
function applyRotation() {
  const sideways = rotation % 180 !== 0;
  $('v').style.width = `${sideways ? innerHeight : innerWidth}px`;
  $('v').style.height = `${sideways ? innerWidth : innerHeight}px`;
  $('v').style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
}

$('rot').onclick = () => {
  rotation = (rotation + 90) % 360;
  try { localStorage.setItem('pettv-rotation', String(rotation)); } catch {}
  applyRotation();
};
addEventListener('resize', applyRotation);
applyRotation();

$('unmute').onclick = () => {
  $('v').muted = false;
  $('v').play().catch(() => {});
  $('unmute').hidden = true;
};
</script>
</body>
</html>
